[project]
name = "biscuits"
version = "0.1.0"
description = "BiscuITs - AI-Powered Document Processing and Analysis"
authors = [
    {name = "Daniel Senften", email = "daniel.senften@ffhs.ch"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13.1"
packages = [{include = "biscuits"}]

dependencies = [
    "anthropic>=0.68.0",
    "docling>=2.58.0",
    "httpx>=0.28.1",
    "logfire>=4.9.0",
    "mcp>=1.14.1",
    "mcp-client>=0.0.0",
    "openai>=1.109.0",
    "playwright>=1.55.0",
    "pydantic-ai>=1.0.10",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "tiktoken>=0.11.0",
    "uvicorn>=0.37.0",
    "watchdog>=6.0.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
]
