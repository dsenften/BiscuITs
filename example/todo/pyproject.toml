[tool.poetry]
name = "todo-manager"
version = "0.1.0"
description = "A simple todo manager application"
authors = ["Daniel Senften <daniel.senften@talent-factory.ch>"]

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.31.0"
sqlalchemy = "^2.0.25"
pydantic = "^2.5.3"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
